version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=sqlite:///blog.db
      - FLASK_ENV=development
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped

  # Optional: PostgreSQL for production-like setup
