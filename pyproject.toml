[tool.poetry]
name = "personal-blog"
version = "0.1.0"
description = "A personal blog website built with Flask"
authors = ["ritesh.sonawala@gmail.com"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
flask = "^3.0.0"
flask-sqlalchemy = "^3.1.1"
flask-migrate = "^4.0.5"
flask-wtf = "^1.2.1"
wtforms = "^3.1.0"
python-dotenv = "^1.0.0"
gunicorn = "^21.2.0"
bleach = "^6.1.0"
markdown = "^3.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.11.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"